[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
kotlinxMetadata = "0.9.0"
okhttp = "5.5.0"
protobuf = "4.35.1"
protobufPlugin = "0.10.0"
xposedkit = "1.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
xposedkit = { id = "cc.meteormc.xposedkit.plugin", version.ref = "xposedkit" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlinx-metadata = { module = "org.jetbrains.kotlinx:kotlinx-metadata-jvm", version.ref = "kotlinxMetadata" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
protobuf-java = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }